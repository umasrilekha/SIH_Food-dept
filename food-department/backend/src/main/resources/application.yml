server:
  port: ${PORT:${SERVER_PORT:8081}}
  servlet:
    context-path: /

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://localhost:8081}

spring:
  application:
    name: food-department-backend
  datasource:
    url: ${DATABASE_URL:${SPRING_DATASOURCE_URL:jdbc:h2:mem:food_department_db;DB_CLOSE_DELAY=-1;MODE=PostgreSQL}}
    username: ${DATABASE_USERNAME:${SPRING_DATASOURCE_USERNAME:sa}}
    password: ${DATABASE_PASSWORD:${SPRING_DATASOURCE_PASSWORD:}}
  h2:
    console:
      enabled: ${ENABLE_H2_CONSOLE:true}
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true

govmesh:
  jwt:
    secret: ${JWT_SECRET:GovMeshFoodDept2026SuperSecretKeyDepartment2Maharashtra2026}
    expiration-ms: ${JWT_EXPIRATION_MS:1800000} # 30 Minutes
  service:
    api-key: ${GOVMESH_SERVICE_API_KEY:GovMeshSecretServiceKey2026InterDepartment}
    jwt:
      secret: ${GOVMESH_SERVICE_JWT_SECRET:GovMeshServiceAccountSecretKey2026SuperSecret}
      expiration-ms: ${GOVMESH_SERVICE_JWT_EXPIRATION_MS:86400000}

logging:
  level:
    root: INFO
    com.govmesh.food: DEBUG
    org.springframework.security: INFO
